[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ml_risk"
version = "0.1.0"
description = "Meta-labeling risk layer for XAUUSD: P(win) model on a toy primary strategy, walk-forward evaluated against fixed-% and ATR sizing."
readme = "README.md"
requires-python = ">=3.9,<3.11"
# Exact pins live in requirements.txt / environment.yml. lightgbm is held at
# 3.3.5 because the consuming Go bot loads models with github.com/dmitryikh/leaves,
# which reads the LightGBM v3 text format.
dependencies = [
  "numpy==1.26.4",
  "pandas==2.2.2",
  "pyarrow==16.1.0",
  "lightgbm==3.3.5",
  "scikit-learn==1.5.1",
  "matplotlib==3.9.1",
  "pyyaml==6.0.1",
]

[project.optional-dependencies]
test = ["pytest==8.2.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:pyparsing.*", "ignore::DeprecationWarning:matplotlib.*"]
