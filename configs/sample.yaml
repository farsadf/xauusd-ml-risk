# Smoke-test config on the bundled SYNTHETIC sample (data/sample/). The synthetic
# random walk has no price signal, but it does have a COST signal: a trade whose stop
# is small relative to spread + commission is less likely to finish net-positive.
# The meta-model therefore reaches AUC ~0.6 here, and the non-ML cost-rule baseline
# matches it — which is exactly why that baseline is part of every evaluation.
run_name: synthetic_sample

data:
  path: data/sample/xauusd_synthetic_1m.csv.gz
  start: null
  end: null
  bar_minutes: 5
output_dir: runs

primary:
  ema_fast: 20
  ema_slow: 50
  swing_lookback: 10
  tp_r: 2.5
  min_risk_spreads: 2.0
  max_entry_delay_minutes: 5
  max_hold_minutes: 1440
  warmup_bars: 200

costs:
  commission_per_side_per_lot: 2.25
  contract_size: 100
  extra_slippage_per_side: 0.0

features:
  atr_window: 20
  bb_window: 20
  bb_k: 2.0
  stoch_k: 14
  stoch_smooth: 3
  stoch_d: 3
  adx_window: 14
  use_spread: true
  include_trade_context: true

model:
  base_params:
    objective: binary
    learning_rate: 0.05
    feature_fraction: 0.8
    bagging_fraction: 0.8
    bagging_freq: 1
    lambda_l2: 1.0
    num_threads: 1
    deterministic: true
    force_row_wise: true
    verbose: -1
  search:
    max_depth: [3]
    min_data_in_leaf: [20, 50]
  num_leaves_from_depth: true
  max_rounds: 300
  early_stopping_rounds: 30

validation:
  scheme: expanding
  min_train_months: 2
  test_months: 1
  rolling_train_months: 3
  inner_folds: 2
  early_stop_frac: 0.15
  embargo_minutes: null
  seeds: [0, 1]

sizing:
  initial_equity: 10000
  fixed_risk: 0.01
  atr:
    ref_window_bars: 1440
    min_mult: 0.5
    max_mult: 2.0
  threshold:
    grid_min: 0.15
    grid_max: 0.60
    grid_step: 0.01
    min_keep_frac: 0.25
  kelly:
    fraction: 0.25
    max_risk: 0.02
  round_lots: false                    # fractional lots: every policy trades exactly the intended size, so
  lot_step: 0.01                       # comparisons are not distorted by the 0.01-lot floor once equity shrinks

report:
  bootstrap_block_days: 5
  bootstrap_samples: 200
